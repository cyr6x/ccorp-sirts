name: Bootstrap fresh SIRTS dev auth

on:
  workflow_dispatch:
  push:
    branches:
      - dev/chatgpt-isolated-sirts
    paths:
      - client/scripts/bootstrap-auth.mjs
      - .github/workflows/bootstrap-dev-auth.yml

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund
      - run: node scripts/bootstrap-auth.mjs
