name: SIRTS Fresh BaaS UAT

on:
  push:
    branches:
      - dev/chatgpt-isolated-sirts

jobs:
  bootstrap-and-uat:
    if: contains(github.event.head_commit.message, 'bootstrap fresh dev')
    runs-on: ubuntu-latest
    env:
      SIRTS_SUPABASE_URL: https://pvtissqcpskpxlduxuta.supabase.co
      SIRTS_SUPABASE_KEY: sb_publishable_t1n4jLjtt_eSWDtQj7vCaw_Q2wY6DzY
      SIRTS_ADMIN_EMAIL: sarah.sirts.260919.f7a9@gmail.com
      SIRTS_LEAD_EMAIL: cyril.sirts.260919.f7a9@gmail.com
      SIRTS_L1_EMAIL: allan.sirts.260919.f7a9@gmail.com
      SIRTS_L2_EMAIL: tony.sirts.260919.f7a9@gmail.com
      SIRTS_L3_EMAIL: david.sirts.260919.f7a9@gmail.com
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund

      - name: Dependency audit diagnostic
        run: npm audit --audit-level=high || true

      - name: Prepare accepted UAT auth addresses
        run: |
          sed -i 's#sarah@ccorp.example.com#sarah.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#cyril@ccorp.example.com#cyril.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#allan@ccorp.example.com#allan.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#tony@ccorp.example.com#tony.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#david@ccorp.example.com#david.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#ellen@ccorp.example.com#ellen.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#lisa@ccorp.example.com#lisa.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs
          sed -i 's#mike@ccorp.example.com#michael.sirts.260919.f7a9@gmail.com#g' scripts/bootstrap-fresh.mjs

      - name: Bootstrap real Auth users and exercise BaaS
        run: node scripts/bootstrap-fresh.mjs

      - name: Live RLS and workflow abuse checks
        run: node scripts/security-postcheck.mjs

      - name: Source regression tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser UAT against fresh Supabase
        run: npm run e2e
