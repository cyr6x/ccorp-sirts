name: SIRTS Dev CI

on:
  push:
    branches:
      - dev/chatgpt-isolated-sirts
  pull_request:
    branches:
      - dev/chatgpt-isolated-sirts

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
